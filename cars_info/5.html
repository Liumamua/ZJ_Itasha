<!DOCTYPE html>

    <title>枝痛组-Z.J.Itasha</title>

    <link rel="shortcut icon" href="../ZJ_Itasha_logo_color.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: { primary: "#08080e", secondary: "#0f0f1a", tertiary: "#16162a", accent: "#e88388" },
                        member: { beila: "#DB7D74", jiaran: "#E799B0", nailin: "#576690", sinuo: "#7252C0", xinyi: "#C93773" }
                    },
                    fontFamily: { display: ['"Space Grotesk"', "sans-serif"], jp: ['"Noto Sans SC"', "sans-serif"] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../assets/shared.css">
</head>
<body class="bg-gradient-animate font-jp text-gray-200 antialiased">

<!-- 导航栏 -->
<header class="fixed w-full top-0 z-50 h-[72px] bg-[#08080e]/30 backdrop-blur-xl border-b border-white/10" id="navbar">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8 h-[72px] flex justify-between items-center">
        <!-- Logo区域 -->
        <div class="flex items-center gap-5">
            <div class="h-10 flex items-center justify-center">
                <img src="../pictures/logos/ZJ_Enter_light.png" alt="枝江娱乐Logo" class="h-full object-contain" id="zjLogo">
                <span class="hidden text-xs text-gray-400 ml-2" id="zjLogoFallback">枝江</span>
            </div>
            <div class="w-[2px] h-8 bg-gradient-to-b from-transparent via-white/30 to-transparent hidden sm:block"></div>
            <div class="h-5 flex items-center justify-center">
                <img src="../pictures/logos/A-SOUL_light.png" alt="A-SOUL Logo" class="h-full object-contain" id="asoulLogo">
                <span class="hidden text-xs text-gray-400" id="asoulLogoFallback">A-SOUL</span>
            </div>
        </div>

        <!-- 枝痛组Logo（居中） -->
        <div class="absolute left-1/2 -translate-x-1/2 h-10 flex items-center justify-center">
            <img src="../pictures/logos/ZJ_Ita_light.png" alt="枝痛组Logo" class="h-full object-contain" id="zjitaLogo">
        </div>

        <!-- 桌面端导航菜单 -->
        <nav class="hidden md:flex items-center gap-8">
            <a href="../index.html" class="text-base font-display text-gray-300 hover:text-white transition-colors duration-300 flex items-center nav-link">首页</a>
            <div class="relative group">
                <span class="text-base font-display font-bold text-[#DB7D74] transition-colors duration-300 cursor-pointer inline-flex items-center gap-1 select-none">
                    痛车展示
                    <svg class="w-3 h-3 mt-0.5 text-gray-500 group-hover:text-white transition-transform duration-200 group-hover:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </span>
                <div class="absolute top-full left-[-4px] mt-2 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50">
                    <div class="bg-[#16162a]/95 backdrop-blur-xl rounded-lg border border-white/[0.08] shadow-lg shadow-black/40 overflow-hidden min-w-[140px]">
                        <a href="cars_in_service.html" class="block px-4 py-2.5 text-sm text-gray-300 hover:text-white hover:bg-gradient-to-r hover:from-[#DB7D74]/10 hover:to-transparent transition-all duration-200">现役痛车</a>
                        <a href="javascript:void(0)" onclick="if(confirm('英灵殿内为已换版的过往作品或存在绝版人物的作品，请在家长陪同下谨慎观看。')){window.location.href='cars_retired.html';}" class="block px-4 py-2.5 text-sm text-gray-300 hover:text-white hover:bg-gradient-to-r hover:from-[#E799B0]/10 hover:to-transparent transition-all duration-200 border-t border-white/5">英灵殿</a>
                    </div>
                </div>
            </div>
            <a href="../activities.html" class="text-base font-display font-medium text-gray-300 hover:text-white transition-colors duration-300 flex items-center">线下应援</a>
            <a href="../index.html#intro-section" class="text-base font-display font-medium text-gray-300 hover:text-white transition-colors duration-300 flex items-center nav-link">关于枝痛</a>
        </nav>

        <!-- 移动端菜单按钮 -->
        <button class="md:hidden text-lg text-gray-300 hover:text-white transition-colors" id="menuBtn">
            <i class="fa-solid fa-bars"></i>
        </button>
    </div>
</header>
<!-- 移动端导航菜单 -->
<div class="md:hidden hidden glass-card border-t border-white/5 fixed top-[72px] left-0 right-0 z-40" id="mobileMenu">
    <div class="container mx-auto px-6 py-5 flex flex-col space-y-3">
        <a href="../index.html" class="text-base font-display text-white py-2 border-b border-white/5">首页</a>
        <a href="cars_in_service.html" class="text-base font-display text-gray-300 hover:text-white py-2 border-b border-white/5 transition-colors">现役痛车</a>
        <a href="javascript:void(0)" onclick="confirmEnterPast()" class="text-base font-display text-gray-300 hover:text-white py-2 border-b border-white/5 transition-colors">英灵殿</a>
        <a href="../activities.html" class="text-base font-display text-gray-300 hover:text-white py-2 border-b border-white/5 transition-colors">线下应援</a>

    </div>

<!-- 详情内容区 - 宽度80%，左对齐 -->
<section class="relative pt-28 pb-20 z-10 min-h-screen">
    <div class="w-[80%] mx-auto px-4">
        <!-- 痛车名字和返回按钮同行 -->
        <div class="flex justify-between items-end mb-4 mt-6 fade-up">
            <h1 class="text-4xl sm:text-5xl font-bold text-white font-display tracking-tight">思诺（2025生日服） </h1>
            <a href="cars_in_service.html" class="inline-flex items-center text-gray-500 hover:text-white transition-colors text-sm group mb-1">
                返回现役痛车 <i class="fa-solid fa-arrow-right ml-2 group-hover:translate-x-1 transition-transform duration-300"></i>
            </a>
        </div>

        <div class="divider-neon mb-12 fade-up" style="transition-delay: 0.1s"></div>

        <!-- 主要内容 -->
        <div class="space-y-10 fade-up" style="transition-delay: 0.2s">

            <!-- 车主说 -->
            <div>
                <p class="text-xl sm:text-2xl text-white font-medium leading-relaxed mb-3">车主说</p>
                <p class="text-base text-gray-500">诺宝超级无敌可爱，真正的枝江vocal，最最最最最喜欢诺宝了！</p>
            </div>

            <!-- 痛车信息 - 2列表格 -->
            <div>
                <h2 class="text-lg sm:text-xl text-gray-200 font-medium mb-4">痛车信息</h2>
                <div class="grid grid-cols-2 gap-x-12 gap-y-3 max-w-3xl">
                    <div class="flex"><span class="text-sm text-gray-500 w-20 shrink-0">痛车主题</span><span class="text-sm text-gray-300">枝江闪耀舞台 思诺</span></div>
                    <div class="flex"><span class="text-sm text-gray-500 w-20 shrink-0">车型</span><span class="text-sm text-gray-300">BMW M240i</span></div>
                    <div class="flex"><span class="text-sm text-gray-500 w-20 shrink-0">常驻地区</span><span class="text-sm text-gray-300">江苏·南京</span></div>
                    <div class="flex"><span class="text-sm text-gray-500 w-20 shrink-0">完成时间</span><span class="text-sm text-gray-300">2025-10</span></div>
                </div>
            </div>

            <!-- 痛车展示 -->
            <div>
                <h2 class="text-lg sm:text-xl text-gray-200 font-medium mb-5">痛车展示</h2>

                <!-- 所有图片统一尺寸，两行两列 -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6">
                    <div class="glass-card rounded-2xl overflow-hidden aspect-video">
                        <img src="../pictures/photos/cars_in_service/M240_Gladys/fig1.jpg" alt="视角1" class="w-full h-full object-cover">
                    </div>
                    <div class="glass-card rounded-2xl overflow-hidden aspect-video">
                        <img src="../pictures/photos/cars_in_service/M240_Gladys/fig2.jpg" alt="侧面" class="w-full h-full object-cover">
                    </div>
                    <div class="glass-card rounded-2xl overflow-hidden aspect-video">
                        <img src="../pictures/photos/cars_in_service/M240_Gladys/fig3.jpg" alt="正面" class="w-full h-full object-cover">
                    </div>
                    <div class="glass-card rounded-2xl overflow-hidden aspect-video">
                        <img src="../pictures/photos/cars_in_service/M240_Gladys/fig4.jpg" alt="细节" class="w-full h-full object-cover">
                    </div>
                    <div class="glass-card rounded-2xl overflow-hidden aspect-video">
                        <img src="../pictures/photos/cars_in_service/M240_Gladys/fig5.jpg" alt="细节" class="w-full h-full object-cover">
                    </div>
                    <div class="glass-card rounded-2xl overflow-hidden aspect-video">
                        <img src="../pictures/photos/cars_in_service/M240_Gladys/fig6.jpg" alt="细节" class="w-full h-full object-cover">
                    </div>
                    <div class="glass-card rounded-2xl overflow-hidden aspect-video">
                        <img src="../pictures/photos/cars_in_service/M240_Gladys/fig7.jpg" alt="细节" class="w-full h-full object-cover">
                    </div>
                    <div class="glass-card rounded-2xl overflow-hidden aspect-video">
                        <img src="../pictures/photos/cars_in_service/M240_Gladys/fig8.jpg" alt="细节" class="w-full h-full object-cover">
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
